[Gameplay]
; Fare charged per world-distance unit. Range 0.0-100.0; default 0.1.
FareMultiplier=0.1
; Set to 1 to disable fare checks and charges. Values 0 or 1; default 0.
FreeRides=0
; Maximum distance from Tommy to an ambient taxi. Range 1.0-100.0; default 10.0.
HailRadius=10.0
; Destinations closer than this cannot be selected. Range 0.0-1000.0; default 20.0.
MinimumTripDistance=20.0
; Time allowed for passenger entry in milliseconds. Range 1000-60000; default 8000.
PassengerWaitMs=8000
; Autopilot speed during a trip. Range 1-100; default 25.
TravelCruiseSpeed=25
; Autopilot speed after taxi release. Range 1-100; default 10.
WanderCruiseSpeed=10
; Skip-travel fade-out time in milliseconds. Range 250-10000; default 1500.
FadeOutMs=1500
; Skip-travel fade-in time in milliseconds. Range 250-10000; default 2500.
FadeInMs=2500

[Camera]
; Passenger camera offset forward from Tommy's head. Range -1.0 to 1.0; default 0.25.
ForwardOffset=0.25
; Passenger camera vertical offset. Range -1.0 to 1.0; default 0.06.
UpOffset=0.06
; Interior-camera near clip. Range 0.01-1.0; default 0.05.
NearClip=0.05
; Passenger camera field of view in degrees. Range 30-120; default 70.
FOV=70.0
; Horizontal mouse sensitivity. Range 0.0-2.0; default 0.1.
MouseSensitivity=0.1
; Maximum view angle left/right in degrees. Range 30-170; default 110.
MaxYawDegrees=110.0

[Waypoint]
; Maximum waypoint-to-road-node snap distance. Range 5-100; default 30.
MaximumRoadSnapDistance=30.0

[UI]
; Font used by TaxiManagerVC's quick destination text, fare text, and categorized
; destination browser. Safe styles: 0=Gothic, 1=Subtitles, 2=Pricedown.
; The previously exposed raw value 3 is invalid in Vice City and is unavailable.
; Valid range 0-2; default 0. Restart the game after editing.
MenuFontStyle=1

